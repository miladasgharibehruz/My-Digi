name: Build My Digi Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        shell: pwsh
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Write release update config
        shell: pwsh
        run: |
          @{ repo = $env:GITHUB_REPOSITORY } | ConvertTo-Json | Set-Content -Encoding UTF8 update_config.json

      - name: Build My Digi EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean MyDigi.spec

      - name: Build updater EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean MyDigiUpdater.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" MyDigi.iss'

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash "installer\My Digi.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii "installer\My Digi.exe.sha256" "$hash  My Digi.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## تغییرات My Digi ${{ github.ref_name }}

            - نسخه جدید My Digi منتشر شد.
            - اطلاعات کاربر در هنگام آپدیت حفظ می‌شوند.
            - قبل از آپدیت، نسخه قبلی پشتیبان‌گیری می‌شود و امکان بازگشت وجود دارد.
          files: |
            installer/My Digi.exe
            installer/My Digi.exe.sha256
