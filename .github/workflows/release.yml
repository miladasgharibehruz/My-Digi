name: Build My Digi Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Write release update config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @{
            repo = $env:GITHUB_REPOSITORY
          } | ConvertTo-Json | Set-Content -Encoding UTF8 update_config.json

      - name: Build My Digi EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m PyInstaller --noconfirm --clean MyDigi.spec

          if ($LASTEXITCODE -ne 0) {
            throw "My Digi EXE build failed with exit code $LASTEXITCODE"
          }

      - name: Build updater EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m PyInstaller --noconfirm --clean MyDigiUpdater.spec

          if ($LASTEXITCODE -ne 0) {
            throw "Updater EXE build failed with exit code $LASTEXITCODE"
          }

      - name: Prepare updater for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========================================"
          Write-Host "Checking PyInstaller output..."
          Write-Host "========================================"

          if (Test-Path -LiteralPath "dist") {
            Get-ChildItem -Path "dist" -Recurse -Force |
              Select-Object FullName, Length
          }
          else {
            throw "dist directory does not exist."
          }

          $updater = "dist\My Digi Updater.exe"

          if (-not (Test-Path -LiteralPath $updater)) {
            throw "PyInstaller did not create: $updater"
          }

          $updaterDir = "dist\My Digi Updater"

          New-Item -ItemType Directory -Path $updaterDir -Force | Out-Null

          Move-Item `
            -LiteralPath $updater `
            -Destination "$updaterDir\My Digi Updater.exe" `
            -Force

          if (-not (Test-Path -LiteralPath "$updaterDir\My Digi Updater.exe")) {
            throw "Failed to prepare updater for installer."
          }

          Write-Host "========================================"
          Write-Host "Updater prepared successfully:"
          Write-Host "$updaterDir\My Digi Updater.exe"
          Write-Host "========================================"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          Write-Host "========================================"
          Write-Host "Current directory:"
          Write-Host (Get-Location)
          Write-Host "========================================"

          Write-Host "ISCC path:"
          Write-Host $iscc

          Write-Host "ISCC exists:"
          Write-Host (Test-Path -LiteralPath $iscc)

          Write-Host "MyDigi.iss exists:"
          Write-Host (Test-Path -LiteralPath "MyDigi.iss")

          Write-Host "========================================"
          Write-Host "Checking required installer files..."
          Write-Host "========================================"

          Write-Host "dist\My Digi.exe:"
          Write-Host (Test-Path -LiteralPath "dist\My Digi.exe")

          Write-Host "dist\My Digi Updater\My Digi Updater.exe:"
          Write-Host (Test-Path -LiteralPath "dist\My Digi Updater\My Digi Updater.exe")

          Write-Host "update_config.json:"
          Write-Host (Test-Path -LiteralPath "update_config.json")

          Write-Host "========================================"
          Write-Host "dist contents:"
          Write-Host "========================================"

          if (Test-Path -LiteralPath "dist") {
            Get-ChildItem -Path "dist" -Recurse -Force |
              Select-Object FullName, Length
          }
          else {
            Write-Host "WARNING: dist directory does not exist."
          }

          Write-Host "========================================"
          Write-Host "Running Inno Setup..."
          Write-Host "========================================"

          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }

          if (-not (Test-Path -LiteralPath "MyDigi.iss")) {
            throw "MyDigi.iss not found in $PWD"
          }

          if (-not (Test-Path -LiteralPath "dist\My Digi.exe")) {
            throw "Required file not found: dist\My Digi.exe"
          }

          if (-not (Test-Path -LiteralPath "dist\My Digi Updater\My Digi Updater.exe")) {
            throw "Required file not found: dist\My Digi Updater\My Digi Updater.exe"
          }

          if (-not (Test-Path -LiteralPath "update_config.json")) {
            throw "Required file not found: update_config.json"
          }

          & $iscc "$PWD\MyDigi.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Checking installer output..."

          if (-not (Test-Path -LiteralPath "installer\My Digi.exe")) {
            Write-Host "Installer directory contents:"

            if (Test-Path -LiteralPath "installer") {
              Get-ChildItem -Path "installer" -Recurse -Force |
                Select-Object FullName, Length
            }
            else {
              Write-Host "installer directory does not exist."
            }

            throw "Installer was not created: installer\My Digi.exe"
          }

          Write-Host "Installer successfully created:"
          Get-Item "installer\My Digi.exe" |
            Select-Object FullName, Length

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $hash = (
            Get-FileHash "installer\My Digi.exe" -Algorithm SHA256
          ).Hash.ToLower()

          Set-Content `
            -Encoding ascii `
            "installer\My Digi.exe.sha256" `
            "$hash  My Digi.exe"

          Write-Host "SHA-256:"
          Write-Host $hash

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## تغییرات My Digi ${{ github.ref_name }}

            - نسخه جدید My Digi منتشر شد.
            - اطلاعات کاربر در هنگام آپدیت حفظ می‌شوند.
            - قبل از آپدیت، نسخه قبلی پشتیبان‌گیری می‌شود و امکان بازگشت وجود دارد.
          files: |
            installer/My Digi.exe
            installer/My Digi.exe.sha256
