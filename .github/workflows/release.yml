name: Build and Publish My Digi

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, for example 2.0.1'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and apply version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^[vV]', ''
          }
          else {
            $version = '${{ inputs.version }}'.Trim() -replace '^[vV]', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use x.y.z format, for example 2.0.1. Received: $version"
          }

          $sourcePath = 'My_Digi(1).py'
          $source = Get-Content -LiteralPath $sourcePath -Raw -Encoding UTF8
          $source = [regex]::Replace($source, 'APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$version`"", 1)
          Set-Content -LiteralPath $sourcePath -Value $source -Encoding UTF8

          $issPath = 'MyDigi.iss'
          $iss = Get-Content -LiteralPath $issPath -Raw -Encoding UTF8
          $iss = [regex]::Replace($iss, '#define MyDigiVersion\s+"[^"]+"', "#define MyDigiVersion `"$version`"", 1)
          Set-Content -LiteralPath $issPath -Value $iss -Encoding UTF8

          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building My Digi $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Write update configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @{ repo = $env:GITHUB_REPOSITORY } |
            ConvertTo-Json |
            Set-Content -Encoding UTF8 update_config.json

      - name: Build application and updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean MyDigi.spec
          if ($LASTEXITCODE -ne 0) { throw 'My Digi build failed.' }
          python -m PyInstaller --noconfirm --clean MyDigiUpdater.spec
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed.' }

          $updater = 'dist\My Digi Updater.exe'
          if (-not (Test-Path -LiteralPath $updater)) { throw "Missing updater output: $updater" }
          New-Item -ItemType Directory -Path 'dist\My Digi Updater' -Force | Out-Null
          Move-Item -LiteralPath $updater -Destination 'dist\My Digi Updater\My Digi Updater.exe' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          foreach ($required in @(
            'dist\My Digi.exe',
            'dist\My Digi Updater\My Digi Updater.exe',
            'My Digi.ico',
            'update_config.json'
          )) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Required file missing: $required" }
          }
          & $iscc "$PWD\MyDigi.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'installer\My-Digi-Setup.exe')) { throw 'Installer was not created.' }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash 'installer\My-Digi-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii 'installer\My-Digi-Setup.exe.sha256' "$hash  My-Digi-Setup.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Digi-${{ steps.version.outputs.value }}
          path: |
            installer/My-Digi-Setup.exe
            installer/My-Digi-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: My Digi v${{ steps.version.outputs.value }}
          make_latest: true
          generate_release_notes: true
          body: |
            نسخه جدید My Digi آماده نصب است.

            پیش از نصب خودکار، از نسخه برنامه و اطلاعات کاربر پشتیبان گرفته می‌شود.
          files: |
            installer/My-Digi-Setup.exe
            installer/My-Digi-Setup.exe.sha256
